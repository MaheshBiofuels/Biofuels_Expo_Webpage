<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="./biofuels-junction-logo.png" type="image/x-icon">
<title>Biofuels Junction | Company Profile</title>
<style>
:root { --green:#238b45; --dark:#075b2d; --bg:#eef0f2; --text:#252525; --muted:#666; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,.98); border-bottom:1px solid #e5e5e5; box-shadow:0 2px 12px rgba(0,0,0,.09); }
.header-inner { max-width:1180px; min-height:78px; margin:auto; padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
.logo-link { display:flex; align-items:center; }
.logo-link img { display:block; width:205px; height:auto; max-height:62px; object-fit:contain; }
.actions { display:flex; gap:9px; align-items:center; }
.button { display:inline-block; padding:10px 15px; border-radius:7px; text-decoration:none; font-size:14px; font-weight:600; color:var(--green); background:#fff; border:1px solid #cfd8d1; }
.button.primary { color:#fff; background:var(--green); border-color:var(--green); }
.hero { max-width:1000px; margin:26px auto 18px; padding:0 16px; }
.hero-card { background:#fff; border-radius:12px; padding:22px; border-left:5px solid var(--green); box-shadow:0 2px 10px rgba(0,0,0,.06); }
h1 { margin:0 0 7px; color:var(--dark); font-size:clamp(23px,4vw,32px); }
.hero p { margin:0; line-height:1.55; color:var(--muted); }
.document { width:min(1000px,calc(100% - 24px)); margin:0 auto 40px; }
.page { margin:0 auto 18px; background:#fff; box-shadow:0 3px 16px rgba(0,0,0,.13); line-height:0; }
.page img { display:block; width:100%; height:auto; }
footer { text-align:center; padding:25px 16px 35px; color:var(--muted); font-size:13px; background:#fff; }
footer a { color:var(--green); }
@media(max-width:650px) {
.header-inner { min-height:auto; align-items:flex-start; flex-direction:column; padding:10px 14px 12px; }
.logo-link img { width:175px; max-height:52px; }
.actions { width:100%; }
.button { flex:1; text-align:center; }
.hero { margin-top:14px; }
.hero-card { padding:17px; }
.document { width:calc(100% - 10px); }
.page { margin-bottom:8px; }
}
</style>
</head>
<body id="top">
<header>
<div class="header-inner">
<a class="logo-link" href="#top" aria-label="Biofuels Junction">
<img src="biofuels-junction-logo.png" alt="Biofuels Junction">
</a>
<div class="actions">
<a class="button" href="https://www.biofuelsjunction.com" target="_blank" rel="noopener">Company Website</a>
<a class="button primary" href="./Biofuels Junction Profile.pdf" download>Download PDF</a>
</div>
</div>

<div class="hero-card">
<h1>Company Profile</h1>
<p>Net Zero · Sustainability · Rural Economy · Energy Transition</p>

<div class="page"><img src="pages/page-10.png" alt="Biofuels Junction Company Profile - Page 10" loading="lazy"></div>
